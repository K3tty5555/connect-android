plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.connect'
version = '1.0.4'

android {
  namespace "app.connect.modules.connectterminal"
  defaultConfig {
    versionCode 1
    versionName "1.0.4"
  }
}

dependencies {
    // Termux terminal-view（含 terminal-emulator，GPLv3 内嵌，见 android-vendor/*/NOTICE.md）
    implementation project(':terminal-view')
}
